// ── 料金計算 ──────────────────────────────────
function parsePrice(str){
  if(!str||str==="お問い合わせ") return null;
  const m=str.replace(/,/g,"").match(/[\d]+/);
  return m?parseInt(m[0]):null;
}

function calcTotal(){
  let total=0;
  let hasUnknown=false;
  const lines=[];
  state.form.menu.forEach(item=>{
    const priceItem=PRICES.flatMap(c=>c.items).find(x=>x.name===item);
    if(!priceItem) return;
    const base=parsePrice(priceItem.price);
    const count=AC_OPTIONS.includes(item)?(state.form.count[item]||1):1;
    if(base===null){hasUnknown=true;lines.push({label:item+(count>1?` ×${count}台`:""),price:"お問い合わせ"});return;}
    const subtotal=base*count;
    total+=subtotal;
    lines.push({label:item+(count>1?` ×${count}台`:""),price:`¥${subtotal.toLocaleString()}〜`});
  });
  Object.values(state.form.opts||{}).forEach(op=>{
    const m=op.p.replace(/,/g,"").match(/[\d]+/);
    if(m){total+=parseInt(m[0]);lines.push({label:op.l,price:op.p});}
  });
  return {total,hasUnknown,lines};
}

// ── ユーティリティ ─────────────────────────────
function dkey(y,m,d){return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}
function isPast(d){return new Date(state.yr,state.mo-1,d)<=new Date(today.getFullYear(),today.getMonth(),today.getDate());}
function isToday(d){return state.yr===today.getFullYear()&&state.mo===today.getMonth()+1&&d===today.getDate();}
function slotSt(d,h){const day=state.resv[dkey(state.yr,state.mo,d)]||{};return (day[h]||day[String(h)]||{}).status||"available";}
function availCnt(d){return HOURS.filter(h=>slotSt(d,h)==="available").length;}
function isSlotSel(d,h){
  const k=dkey(state.yr,state.mo,d);
  return state.slots.some(s=>s.date===k&&(s.allDay||s.hour===h));
}
function selCntDay(d){return state.slots.filter(s=>s.date===dkey(state.yr,state.mo,d)).length;}

function totalSlots(){
  // 終日=1枠、通常=1スロット1枠でカウント
  return state.slots.length;
}

function toggleSlot(d,h){
  const k=dkey(state.yr,state.mo,d);
  const dow=new Date(state.yr,state.mo-1,d).getDay();
  const label=`${state.mo}月${d}日（${WEEKDAY[dow]}）${String(h).padStart(2,"0")}:00〜${String(h+1).padStart(2,"0")}:00`;
  const exists=state.slots.some(s=>s.date===k&&s.hour===h);
  if(exists){
    setState({slots:state.slots.filter(s=>!(s.date===k&&s.hour===h))});
  } else {
    if(totalSlots()>=3) return; // 合計3枠まで
    setState({slots:[...state.slots,{date:k,hour:h,label}]});
  }
}

// ── HTML生成ヘルパー ──────────────────────────
function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object") Object.assign(el.style,v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className") el.className=v;
    else el.setAttribute(k,v);
  });
  if(children) [].concat(children).forEach(c=>{
    if(c==null||c===false) return;
    el.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });
  return el;
}
function div(s,c){return h("div",{style:s},c);}
function btn(s,onClick,c){return h("button",{style:s,onClick},c);}
function inp(s,val,onInput,type="text",placeholder=""){
  const el=h("input",{style:s,type,placeholder});
  el.value=val||"";
  // changeイベントでrerenderしないで直接stateを更新
  el.addEventListener("change",e=>onInput(e.target.value));
  return el;
}
function ta(s,val,onInput,rows,placeholder){
  const el=h("textarea",{style:s,rows,placeholder});
  el.value=val||"";
  el.addEventListener("change",e=>onInput(e.target.value));
  return el;
}

function buildCal(){
  const wrap=div({});

  // 月ナビ
  const nav=div({display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 20px 10px"});
  nav.appendChild(btn({background:"none",border:`1.5px solid ${C.border}`,borderRadius:"10px",width:"36px",height:"36px",fontSize:"19px",color:C.mid},
    ()=>{if(state.mo===1)setState({yr:state.yr-1,mo:12,selDate:null});else setState({mo:state.mo-1,selDate:null});},"‹"));
  nav.appendChild(div({fontSize:"17px",fontWeight:"700"},`${state.yr}年 ${state.mo}月`));
  nav.appendChild(btn({background:"none",border:`1.5px solid ${C.border}`,borderRadius:"10px",width:"36px",height:"36px",fontSize:"19px",color:C.mid},
    ()=>{if(state.mo===12)setState({yr:state.yr+1,mo:1,selDate:null});else setState({mo:state.mo+1,selDate:null});},"›"));
  wrap.appendChild(nav);
  // 凡例
  const leg=div({display:"flex",gap:"12px",padding:"0 20px 12px",flexWrap:"wrap"});
  [{c:C.accentM,l:"空きあり"},{c:C.warn,l:"残りわずか"},{c:"#e0e0e0",l:"満員"}].forEach(({c,l})=>{
    const item=div({display:"flex",alignItems:"center",gap:"4px",fontSize:"11px",color:C.muted});
    item.appendChild(div({width:"9px",height:"9px",borderRadius:"2px",background:c,display:"inline-block"},""));
    item.appendChild(document.createTextNode(l));
    leg.appendChild(item);
  });
  wrap.appendChild(leg);

  if(state.loading){
    wrap.appendChild(div({textAlign:"center",padding:"40px",color:C.muted,fontSize:"14px"},"読み込み中..."));
    return wrap;
  }

  // カレンダーグリッド
  const days=new Date(state.yr,state.mo,0).getDate();
  const firstDay=new Date(state.yr,state.mo-1,1).getDay();
  const grid=div({background:C.card,margin:"0 12px",borderRadius:"14px",
    border:`1px solid ${C.border}`,overflow:"hidden",boxShadow:"0 2px 16px rgba(0,0,0,0.06)"});
  const wrow=div({display:"grid",gridTemplateColumns:"repeat(7,1fr)",borderBottom:`1px solid ${C.border}`});
  WEEKDAY.forEach((w,i)=>{
    wrow.appendChild(div({textAlign:"center",padding:"9px 0",fontSize:"11px",fontWeight:"700",
      color:i===0?C.sun:i===6?C.sat:C.muted},w));
  });
  grid.appendChild(wrow);
  const drow=div({display:"grid",gridTemplateColumns:"repeat(7,1fr)"});
  for(let i=0;i<firstDay;i++){
    drow.appendChild(div({minHeight:"54px",borderRight:(i+1)%7!==0?`1px solid ${C.border}`:"none",borderBottom:`1px solid ${C.border}`},""));
  }
  for(let d=1;d<=days;d++){
    const idx=firstDay+d-1;
    const past=isPast(d),avail=past?0:availCnt(d);
    const dow=(firstDay+d-1)%7;
    const sc=selCntDay(d);
    const ac=avail===0?"#e0e0e0":avail<=2?C.warn:C.accentM;
    const active=state.selDate===d;
    const cell=div({minHeight:"54px",padding:"7px 4px 5px",
      borderRight:(idx+1)%7!==0?`1px solid ${C.border}`:"none",
      borderBottom:`1px solid ${C.border}`,
      cursor:past||avail===0?"default":"pointer",
      background:active?C.accentL:"transparent",
      outline:active?`2px solid ${C.accent}`:"2px solid transparent",
      outlineOffset:"-2px",position:"relative",transition:"background 0.1s"});
    if(!past&&avail>0) cell.addEventListener("click",()=>setState({selDate:active?null:d}));
    cell.appendChild(div({textAlign:"center",fontSize:"13px",fontWeight:isToday(d)?"700":"400",
      color:past?"#ccc":dow===0?C.sun:dow===6?C.sat:C.text,marginBottom:"3px"},String(d)));
    if(isToday(d)) cell.style.background="#e8eeff";
    if(!past){
      cell.appendChild(div({height:"3px",borderRadius:"2px",margin:"0 5px",background:ac,opacity:avail===0?"0.35":"1"},""));
      if(avail>0) cell.appendChild(div({textAlign:"center",fontSize:"9px",color:ac,marginTop:"2px"},`${avail}枠`));
      else cell.appendChild(div({textAlign:"center",fontSize:"9px",color:C.muted,marginTop:"2px"},"満員"));
    }
    if(sc>0){
      const badge=div({position:"absolute",top:"3px",right:"3px",width:"14px",height:"14px",
        borderRadius:"50%",background:C.accent,color:"#fff",fontSize:"9px",fontWeight:"700",

    // 終日ボタン
    // 終日ボタン：全選択/全解除トグル
    const allAvail=HOURS.filter(h=>slotSt(d,h)==="available");

    sbox.appendChild(shead);
    const sgrid=div({display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px",padding:"12px"});
    HOURS.forEach(h=>{
      const st=slotSt(d,h),avail=st==="available",pend=st==="pending",sel=isSlotSel(d,h);
      // 終日選択中かチェック
      const todayKey2=dkey(state.yr,state.mo,d);
      const allAvail2=HOURS.filter(h2=>slotSt(d,h2)==="available");
      const isAllDay=state.slots.some(s=>s.date===todayKey2&&s.allDay);
      const sb=btn({borderRadius:"10px",padding:"11px 6px",

        border:`1.5px solid ${sel?C.accent:avail?C.accentM:pend?"#f59e0b":C.border}`,

        ()=>{if(avail&&!isAllDay)toggleSlot(d,h);},
        [div({fontSize:"15px"},`${String(h).padStart(2,"0")}:00`),
         div({fontSize:"10px",opacity:"0.8"},sel?"✓ 選択中":avail?"":pend?"仮予約中":"予約済")]);
      sgrid.appendChild(sb);

  }

  // 選択済みリスト
  if(state.slots.length>0){
    const slist=div({margin:"14px 12px 0",background:C.accentL,borderRadius:"12px",
      padding:"12px 14px",border:`1px solid ${C.accentM}`});

      `選択中の希望日時（${state.slots.length}/3枠）`));
    state.slots.forEach((s,i)=>{

      background:C.accent,color:"#fff",fontSize:"14px",fontWeight:"700",
      boxShadow:"0 3px 12px rgba(26,79,160,0.3)"},()=>{setState({step:"form"});setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}),50);},"お客様情報を入力する →"));
    wrap.appendChild(slist);
  }
  return wrap;
}

    async ()=>{
      try{
        if(typeof liff!=="undefined"&&liff.isInClient()){
          await liff.sendMessages([{type:"text",text:lineMsg2}]);
          sendBtn.textContent="✅ 送信しました！";
          sendBtn.style.background="#999";
          sendBtn.disabled=true;
        } else {
          // isInClientがfalseの場合はsendMessagesを強制試行
          try{
            await liff.sendMessages([{type:"text",text:lineMsg2}]);
            sendBtn.textContent="✅ 送信しました！";
            sendBtn.style.background="#999";
            sendBtn.disabled=true;
          }catch(e2){
            window.open("https://line.me/R/oaMessage/"+LINE_OA_ID+"/?"+encodeURIComponent(lineMsg2),"_blank");
          }
        }
      }catch(e){
        window.open("https://line.me/R/oaMessage/"+LINE_OA_ID+"/?"+encodeURIComponent(lineMsg2),"_blank");

    },"📲 仮予約を確定する");

}

function buildPriceModal(){
  const overlay=div({position:"fixed",inset:"0",background:"rgba(0,0,0,0.6)",zIndex:"100",
    display:"flex",alignItems:"flex-end",justifyContent:"center"});
  overlay.addEventListener("click",()=>setState({showPrice:false}));
  const modal=div({background:"#f0f4ff",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:"480px",maxHeight:"92vh",overflowY:"auto"});
  modal.addEventListener("click",e=>e.stopPropagation());
  const mhead=div({position:"sticky",top:"0",background:C.accent,color:"#fff",
    padding:"12px 16px 0",borderRadius:"20px 20px 0 0",zIndex:"1"});
  const headTop=div({display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"});
  const titles={"price":"💰 料金表","faq":"❓ よくある質問","cancel":"📋 キャンセルポリシー"};
  headTop.appendChild(div({fontSize:"16px",fontWeight:"700"},titles[state.priceTab]||"料金表"));
  headTop.appendChild(btn({background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",
    borderRadius:"6px",padding:"4px 10px",fontSize:"12px"},()=>setState({showPrice:false}),"閉じる"));
  mhead.appendChild(headTop);
  // タブ
  const tabRow=div({display:"flex",gap:"0",borderTop:"1px solid rgba(255,255,255,0.2)"});
  [["price","料金表"],["faq","よくある質問"],["cancel","キャンセル"]].forEach(([key,label])=>{
    const t=btn({flex:"1",padding:"8px 4px",border:"none",fontSize:"11px",fontWeight:"700",
      background:state.priceTab===key?"rgba(255,255,255,0.2)":"transparent",
      color:"#fff",borderBottom:state.priceTab===key?"2px solid #fff":"2px solid transparent"},
      ()=>setState({showPrice:true,priceTab:key}),label);
    tabRow.appendChild(t);
  });
  mhead.appendChild(tabRow);
  modal.appendChild(mhead);
  const body=div({padding:"16px 16px 40px"});

  // FAQタブ
  if(state.priceTab==="faq"){
    const faqData2=JSON.parse(localStorage.getItem("cocopi_faq")||"null")||FAQ_DEFAULT;
    faqData2.forEach((item)=>{
      const wrap=div({background:C.card,borderRadius:"12px",marginBottom:"8px",overflow:"hidden",boxShadow:"0 1px 6px rgba(0,0,0,0.06)"});
      const qRow=div({display:"flex",alignItems:"flex-start",gap:"10px",padding:"14px 16px",cursor:"pointer"});
      const qBadge=div({background:C.accent,color:"#fff",borderRadius:"50%",width:"24px",height:"24px",minWidth:"24px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"700"});
      qBadge.textContent="Q";
      const qText=div({fontSize:"14px",fontWeight:"600",color:C.text,flex:"1",lineHeight:"1.6"});
      qText.textContent=item.q;
      const arrow=div({fontSize:"12px",color:C.muted});arrow.textContent="▼";
      qRow.appendChild(qBadge);qRow.appendChild(qText);qRow.appendChild(arrow);
      const aRow=div({display:"none",padding:"0 16px 14px 16px"});
      const aInner=div({display:"flex",alignItems:"flex-start",gap:"10px"});
      const aBadge=div({background:"#888",color:"#fff",borderRadius:"50%",width:"24px",height:"24px",minWidth:"24px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"700"});
      aBadge.textContent="A";
      const aText=div({fontSize:"13px",color:C.mid,lineHeight:"1.8",flex:"1"});
      aText.textContent=item.a;
      aInner.appendChild(aBadge);aInner.appendChild(aText);aRow.appendChild(aInner);
      qRow.addEventListener("click",()=>{const open=aRow.style.display!=="none";aRow.style.display=open?"none":"block";arrow.textContent=open?"▼":"▲";});
      wrap.appendChild(qRow);wrap.appendChild(aRow);body.appendChild(wrap);
    });
    modal.appendChild(body);overlay.appendChild(modal);return overlay;
  }

  // キャンセルタブ
  if(state.priceTab==="cancel"){
    const cancelBox=div({background:C.card,borderRadius:"12px",overflow:"hidden",boxShadow:"0 1px 6px rgba(0,0,0,0.06)",marginBottom:"16px"});
    CANCEL_POLICY.forEach((item,i)=>{
      const row=div({display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderBottom:i<CANCEL_POLICY.length-1?`1px solid ${C.border}`:"none",background:i===CANCEL_POLICY.length-1?"#fff0f0":"transparent"});
      const p=div({fontSize:"14px",color:C.text});p.textContent=item.period;
      const r=div({fontSize:"14px",fontWeight:"700",color:i===CANCEL_POLICY.length-1?"#c0392b":C.text});r.textContent="予約金額の"+item.rate;
      row.appendChild(p);row.appendChild(r);cancelBox.appendChild(row);
    });
    body.appendChild(cancelBox);
    const noteBox=div({background:"#e8eeff",borderRadius:"10px",padding:"12px 14px",
      fontSize:"12px",color:C.accent,lineHeight:"1.8",marginTop:"8px"});
    noteBox.textContent=CANCEL_NOTE;
    body.appendChild(noteBox);
    modal.appendChild(body);overlay.appendChild(modal);return overlay;
  }

  // 料金表タブ
  PRICES.forEach(cat=>{
    const catHeader=div({marginBottom:"8px"});
    const catDetail=div({display:"none",background:"#f8f9ff",borderRadius:"8px",
      padding:"14px",marginTop:"4px",fontSize:"12px",color:C.mid,lineHeight:"1.9",whiteSpace:"pre-wrap",marginBottom:"4px"});
    if(cat.detail) catDetail.textContent=cat.detail;
    const catTitleBtn=document.createElement("button");
    catTitleBtn.style.cssText="width:100%;display:flex;align-items:center;justify-content:space-between;background:"+C.accent+";border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:"+(cat.detail?"pointer":"default")+";font-family:inherit;font-size:13px;font-weight:700;text-align:left;";
    const catLabel=document.createElement("span");
    catLabel.textContent=cat.detail?"▼ "+cat.cat:cat.cat;
    catTitleBtn.appendChild(catLabel);
    if(cat.detail){
      catTitleBtn.addEventListener("click",()=>{
        const open=catDetail.style.display!=="none";
        catDetail.style.display=open?"none":"block";
        catLabel.textContent=open?"▼ "+cat.cat:"▲ "+cat.cat;
      });
    }
    catHeader.appendChild(catTitleBtn);
    catHeader.appendChild(catDetail);
    body.appendChild(catHeader);
    cat.items.forEach(item=>{
      const card=div({background:C.card,borderRadius:"12px",padding:"14px 16px",
        marginBottom:"8px",boxShadow:"0 1px 6px rgba(0,0,0,0.06)"});
      const top=div({display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px"});
      const nameWrap=div({display:"flex",alignItems:"center",gap:"6px",flex:"1",paddingRight:"8px"});
      nameWrap.appendChild(div({fontSize:"14px",fontWeight:"700",color:C.text},item.name));
      // noteが短い場合（※戸建てに限る など）は横に、長い場合は下に
      if(item.note&&item.note.length<=10) nameWrap.appendChild(div({fontSize:"11px",color:C.muted},item.note));
      top.appendChild(nameWrap);
      top.appendChild(div({fontSize:"16px",fontWeight:"700",color:C.warn,whiteSpace:"nowrap"},item.price));
      card.appendChild(top);
      if(item.note&&item.note.length>10) card.appendChild(div({fontSize:"11px",color:"#777",lineHeight:"1.7",marginBottom:"6px",whiteSpace:"pre-wrap"},item.note));
      if(item.caution) card.appendChild(div({fontSize:"11px",color:C.danger,background:"#fff0f0",padding:"6px 8px",borderRadius:"6px",marginBottom:"6px"},item.caution));
      if(item.detail){
        const detailBtn=document.createElement("button");
        detailBtn.style.cssText="width:100%;background:none;border:none;color:"+C.accent+";font-size:11px;font-family:inherit;cursor:pointer;text-align:left;padding:4px 0;";
        detailBtn.textContent="▼ 詳細を見る";
        const detailBox=div({display:"none",background:"#f8f9ff",borderRadius:"8px",padding:"12px",marginTop:"4px",fontSize:"11px",color:C.mid,lineHeight:"1.9",whiteSpace:"pre-wrap"});
        detailBox.textContent=item.detail;
        detailBtn.addEventListener("click",()=>{const open=detailBox.style.display!=="none";detailBox.style.display=open?"none":"block";detailBtn.textContent=open?"▼ 詳細を見る":"▲ 閉じる";});
        card.appendChild(detailBtn);
        card.appendChild(detailBox);
      }
      if(item.opts&&item.opts.length){
        const optbox=div({marginTop:"6px",paddingTop:"6px",borderTop:"1px solid #f0f0f0"});
        optbox.appendChild(div({fontSize:"10px",color:"#999",marginBottom:"4px",fontWeight:"700",letterSpacing:"0.05em"},"オプション"));
        const optrow=div({display:"flex",flexWrap:"wrap",gap:"4px"});
        item.opts.forEach(op=>{
          const tag=div({background:"#e8eeff",borderRadius:"6px",padding:"3px 8px",fontSize:"11px",color:C.accent,display:"flex",gap:"4px"});
          tag.appendChild(document.createTextNode(op.l));
          tag.appendChild(div({fontWeight:"700",color:C.warn},op.p));
          optrow.appendChild(tag);
        });
        optbox.appendChild(optrow);
        card.appendChild(optbox);
      }
      body.appendChild(card);
    });
  });
  body.appendChild(div({padding:"12px 16px",background:"#fff8e8",borderRadius:"10px",
    border:"1px solid #f6d03a",fontSize:"12px",color:"#7a5a10",lineHeight:"1.8"},
    "※ お支払いは現金のみになります。\n※ 料金は税込み表示です。"));

  modal.appendChild(body);
  overlay.appendChild(modal);
  return overlay;
}

function buildAdminModal(){

  if(!state.adminUnlocked){
    modal.appendChild(div({fontSize:"16px",fontWeight:"700",marginBottom:"12px"},"🔒 管理者ログイン"));

      background:C.accent,color:"#fff",fontSize:"14px",fontWeight:"700"},

      tabs.appendChild(btn({flex:"1",padding:"10px",borderRadius:"10px",border:"none",
        background:state.adminTab===tab?C.accent:"#f0f4ff",
        color:state.adminTab===tab?"#fff":C.mid,fontSize:"13px",fontWeight:"700"},
        ()=>setState({adminTab:tab}),label));
    });
    modal.appendChild(tabs);

    if(state.adminTab==="block"){
    modal.appendChild(div({fontSize:"12px",color:C.muted,marginBottom:"14px"},"日付・時間を複数選択できます。丸一日は「全時間」をタップ。"));

    // 日付選択
    modal.appendChild(div({fontSize:"13px",fontWeight:"700",color:C.mid,marginBottom:"6px"},"日付（複数選択可）"));

      border:`1.5px solid ${C.border}`,fontSize:"14px",marginBottom:"8px"}});
    di.value="";
    di.addEventListener("change",e=>{
      const d=e.target.value;
      if(!d) return;
      const current=state.blockDate.split(",").filter(Boolean);
      if(!current.includes(d)){
        state.blockDate=state.blockDate?state.blockDate+","+d:d;
        // タグを直接追加（rerenderしない）
        const tag=document.createElement("div");
        tag.style.cssText="display:flex;align-items:center;gap:4px;background:#e8eeff;border:1px solid #4a7fd4;border-radius:6px;padding:4px 8px;font-size:12px;color:"+C.accent+";";
        tag.textContent=d;
        const xBtn=document.createElement("button");
        xBtn.style.cssText="background:none;border:none;color:#999;font-size:14px;line-height:1;padding:0;cursor:pointer;";
        xBtn.textContent="×";
        xBtn.addEventListener("click",()=>{
          state.blockDate=state.blockDate.split(",").filter(x=>x!==d).join(",");
          tag.remove();
        });
        tag.appendChild(xBtn);
        tagContainer.appendChild(tag);
      }
      setTimeout(()=>{di.value="";},0);
    });
    modal.appendChild(di);
    const tagContainer=div({display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"8px"});

      const tag=document.createElement("div");
      tag.style.cssText="display:flex;align-items:center;gap:4px;background:#e8eeff;border:1px solid #4a7fd4;border-radius:6px;padding:4px 8px;font-size:12px;color:"+C.accent+";";

      xBtn.style.cssText="background:none;border:none;color:#999;font-size:14px;line-height:1;padding:0;cursor:pointer;";
      xBtn.textContent="×";
      xBtn.addEventListener("click",()=>{
        state.blockDate=state.blockDate.split(",").filter(x=>x!==d).join(",");

      });
      tag.appendChild(xBtn);
      tagContainer.appendChild(tag);
    });

      background:C.accent,color:"#fff",fontSize:"14px",fontWeight:"700",marginBottom:"10px"},

      border:`1.5px solid ${C.border}`,background:"#fff",color:C.mid,fontSize:"14px"},
      ()=>setState({showAdmin:false,adminUnlocked:false,adminPass:"",blockMsg:""}),"閉じる"));

        catDetailTa.value=ep[ci].detail||"";

          const drow=div({display:"flex",alignItems:"flex-start",gap:"8px",marginBottom:"6px"});
          drow.appendChild(div({fontSize:"11px",color:C.muted,width:"32px",paddingTop:"8px"},"詳細"));
          const dta=h("textarea",{style:{flex:"1",padding:"8px 10px",borderRadius:"8px",
            border:`1.5px solid ${C.border}`,fontSize:"12px",resize:"none",lineHeight:"1.6"},rows:"4",
            placeholder:"詳細説明（任意）"});
          dta.value=item.detail||"";
          dta.addEventListener("input",e=>{ep[ci].items[ii].detail=e.target.value;});
          drow.appendChild(dta);
          card.appendChild(drow);
          // オプション編集
          const optLabel=div({fontSize:"11px",color:C.muted,fontWeight:"700",marginBottom:"4px"},"オプション");
          card.appendChild(optLabel);
          const optList=div({id:`opts-${ci}-${ii}`});
          function renderOpts(){
            optList.innerHTML="";
            ep[ci].items[ii].opts.forEach((op,oi)=>{
              const orow=div({display:"flex",alignItems:"center",gap:"6px",marginBottom:"4px"});
              const ol=h("input",{type:"text",style:{flex:"1",padding:"6px 8px",borderRadius:"6px",
                border:`1px solid ${C.border}`,fontSize:"11px",color:C.accent},placeholder:"オプション名"});
              ol.value=op.l;
              ol.addEventListener("input",e=>{ep[ci].items[ii].opts[oi].l=e.target.value;});
              const op2=h("input",{type:"text",style:{width:"70px",padding:"6px 8px",borderRadius:"6px",
                border:`1px solid ${C.border}`,fontSize:"11px",color:C.warn,textAlign:"right"},placeholder:"+¥0"});
              op2.value=op.p;
              op2.addEventListener("input",e=>{ep[ci].items[ii].opts[oi].p=e.target.value;});
              const delBtn=btn({background:"none",border:`1px solid #ffaaaa`,borderRadius:"6px",
                color:"#c0392b",fontSize:"12px",padding:"4px 8px",whiteSpace:"nowrap"},
                ()=>{ep[ci].items[ii].opts.splice(oi,1);renderOpts();},"✕");
              orow.appendChild(ol);
              orow.appendChild(op2);
              orow.appendChild(delBtn);
              optList.appendChild(orow);
            });
          }
          renderOpts();
          card.appendChild(optList);
          // オプション追加ボタン
          card.appendChild(btn({width:"100%",padding:"6px",borderRadius:"8px",
            border:`1.5px dashed ${C.accentM}`,background:"#f0f4ff",
            color:C.accent,fontSize:"12px",fontWeight:"700",marginTop:"4px"},
            ()=>{ep[ci].items[ii].opts.push({l:"",p:""});renderOpts();},"＋ オプションを追加"));
          // 並び替え＋削除ボタン
          const ctrlRow=div({display:"flex",gap:"6px",marginTop:"6px"});
          if(ii>0) ctrlRow.appendChild(btn({flex:"1",padding:"6px",borderRadius:"8px",
            border:`1px solid ${C.border}`,background:"#f0f4ff",color:C.accent,fontSize:"13px"},
            ()=>{const tmp=ep[ci].items[ii];ep[ci].items[ii]=ep[ci].items[ii-1];ep[ci].items[ii-1]=tmp;setState({editPrices:JSON.parse(JSON.stringify(ep))});},"↑ 上へ"));
          if(ii<ep[ci].items.length-1) ctrlRow.appendChild(btn({flex:"1",padding:"6px",borderRadius:"8px",
            border:`1px solid ${C.border}`,background:"#f0f4ff",color:C.accent,fontSize:"13px"},
            ()=>{const tmp=ep[ci].items[ii];ep[ci].items[ii]=ep[ci].items[ii+1];ep[ci].items[ii+1]=tmp;setState({editPrices:JSON.parse(JSON.stringify(ep))});},"↓ 下へ"));
          ctrlRow.appendChild(btn({flex:"1",padding:"6px",borderRadius:"8px",
            border:"1.5px dashed #ffaaaa",background:"#fff8f8",
            color:"#c0392b",fontSize:"12px",fontWeight:"700"},
            ()=>{ep[ci].items.splice(ii,1);setState({editPrices:JSON.parse(JSON.stringify(ep))});},"✕ 削除"));
          card.appendChild(ctrlRow);
          modal.appendChild(card);
        });
        // 項目追加ボタン
        modal.appendChild(btn({width:"100%",padding:"8px",borderRadius:"10px",
          border:`1.5px dashed ${C.accentM}`,background:"#f0f4ff",
          color:C.accent,fontSize:"13px",fontWeight:"700",marginBottom:"12px"},
          ()=>{ep[ci].items.push({name:"新しい項目",price:"¥0",note:"",opts:[]});setState({editPrices:ep});},"＋ 項目を追加"));
      });
      // カテゴリ追加ボタン
      modal.appendChild(btn({width:"100%",padding:"10px",borderRadius:"10px",
        border:`2px dashed ${C.accentM}`,background:"#e8eeff",
        color:C.accent,fontSize:"13px",fontWeight:"700",marginBottom:"14px"},
        ()=>{ep.push({cat:"新しいカテゴリ",items:[]});setState({editPrices:JSON.parse(JSON.stringify(ep))});},"＋ カテゴリを追加"));
      if(state.editPriceMsg) modal.appendChild(div({fontSize:"13px",color:C.accent,marginBottom:"10px"},state.editPriceMsg));
      modal.appendChild(btn({width:"100%",padding:"13px",borderRadius:"12px",border:"none",
        background:C.accent,color:"#fff",fontSize:"14px",fontWeight:"700",marginBottom:"10px"},
        ()=>{
          // PRICESを完全に上書きして即時反映
          while(PRICES.length) PRICES.pop();
          ep.forEach(cat=>PRICES.push(JSON.parse(JSON.stringify(cat))));
          try{localStorage.setItem("cocopi_prices",JSON.stringify(PRICES));}catch(e){}
          setState({editPriceMsg:"✅ 保存しました！"});
          setTimeout(()=>setState({editPriceMsg:""}),2000);
        },"💾 保存する"));
      modal.appendChild(btn({width:"100%",padding:"13px",borderRadius:"12px",
        border:`1.5px solid ${C.border}`,background:"#fff",color:C.mid,fontSize:"14px"},
        ()=>setState({showAdmin:false,adminUnlocked:false,adminPass:"",blockMsg:""}),"閉じる"));
    } // end price tab
  }
  overlay.appendChild(modal);
  return overlay;
}

// 右下固定の🔒ボタン
function buildLockBtn(){
  const b=btn({position:"fixed",bottom:"12px",right:"12px",zIndex:"50",
    background:"transparent",border:"none",
    color:"rgba(180,180,180,0.3)",fontSize:"13px",padding:"4px",cursor:"pointer"},
    ()=>setState({showAdmin:true}),"🔒");
  return b;
}

// ── 起動 ─────────────────────────────────────
// LIFF初期化
let lineUserId = null;
async function initLiff(){
  try {
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }
    const profile = await liff.getProfile();
    lineUserId = profile.userId;
    console.log("LIFF UserID:", lineUserId);
    console.log("isInClient:", liff.isInClient());
    console.log("context:", liff.getContext());
  } catch(e) {
    console.warn("LIFF init error:", e);
  }
}
initLiff();

// ── 起動 ─────────────────────────────────────
// 保存済み料金を完全復元
try{
  const saved=localStorage.getItem("cocopi_prices");
  if(saved){
    const savedPrices=JSON.parse(saved);
    while(PRICES.length) PRICES.pop();
    savedPrices.forEach(cat=>PRICES.push(JSON.parse(JSON.stringify(cat))));
  }
}catch(e){}
state.editPrices=JSON.parse(JSON.stringify(PRICES));
loadData();
render();
</script>
